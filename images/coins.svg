<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 1024 640">
  <rect width="100%" height="100%" fill="none"/>

  <defs>
    <g id="coin" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
      
      <!-- coin side -->
      <path d="M -120 0
               C -118 35, -80 65, -15 76
               C 45 86, 105 65, 120 24
               L 120 -4
               C 95 40, 38 56, -15 48
               C -72 40, -112 18, -120 0 Z"
            stroke-width="8"/>

      <!-- top face -->
      <ellipse cx="0" cy="-8" rx="120" ry="58" stroke-width="8"/>

      <!-- inner rim -->
      <ellipse cx="0" cy="-8" rx="101" ry="45" stroke-width="5"/>

      <!-- decorative dots -->
      <ellipse cx="0" cy="-8" rx="72" ry="30"
               stroke-width="4"
               stroke-dasharray="1 12"/>

      <!-- edge ridges -->
      <path d="
        M -102 20 L -102 57
        M -82 29 L -82 65
        M -62 37 L -62 70
        M -42 43 L -42 75
        M -22 47 L -22 78
        M -2 49 L -2 80
        M 18 48 L 18 78
        M 38 44 L 38 74
        M 58 38 L 58 68
        M 78 29 L 78 61
        M 98 17 L 98 49"
        stroke-width="5"/>
    </g>
  </defs>

  <!-- pile arrangement -->

  <g transform="translate(230 360) scale(.72) rotate(4)">
    <use href="#coin"/>
  </g>

  <g transform="translate(390 245) scale(.92) rotate(-9)">
    <use href="#coin"/>
  </g>

  <g transform="translate(585 200) scale(1.18) rotate(7)">
    <use href="#coin"/>
  </g>

  <g transform="translate(810 305) scale(.98) rotate(-5)">
    <use href="#coin"/>
  </g>

  <g transform="translate(690 455) scale(1.08) rotate(3)">
    <use href="#coin"/>
  </g>

  <g transform="translate(470 405) scale(.98) rotate(-1)">
    <use href="#coin"/>
  </g>

  <g transform="translate(135 515) scale(.78) rotate(6)">
    <use href="#coin"/>
  </g>

  <g transform="translate(520 545) scale(.52) rotate(-2)">
    <use href="#coin"/>
  </g>

</svg>